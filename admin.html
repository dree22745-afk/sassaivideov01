<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMNI AI - Admin</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/animations.css">
    <link rel="stylesheet" href="/admin.css">
</head>
<body>
    <div class="admin-container">
        <div class="admin-header">
            <h1>🛡️ Admin Dashboard</h1>
            <button class="logout-btn" onclick="logout()" style="width:auto;margin:0;padding:8px 16px;">Logout</button>
        </div>
        <div class="tabs">
            <div class="tab active" onclick="loadTab('users',this)">Users</div>
            <div class="tab" onclick="loadTab('conversations',this)">Conversations</div>
            <div class="tab" onclick="loadTab('errors',this)">Error Memory</div>
        </div>
        <div id="tabContent"></div>
    </div>
    <script>
        const token = localStorage.getItem('token');
        if(!token) window.location.href='/';

        async function loadTab(tab,el) {
            document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
            el.classList.add('active');
            const res = await fetch(`/admin/${tab}`,{headers:{'Authorization':`Bearer ${token}`}});
            const data = await res.json();
            if(data.error){document.getElementById('tabContent').innerHTML=`<p style="color:#ff4444;padding:20px">${data.error}</p>`;return;}
            
            let html='<table class="data-table"><thead><tr>';
            if(tab==='users') html+='<th>ID</th><th>Email</th><th>Username</th><th>Role</th><th>Joined</th>';
            else if(tab==='conversations') html+='<th>ID</th><th>User</th><th>Title</th><th>Msgs</th><th>Created</th>';
            else html+='<th>ID</th><th>User</th><th>Prompt</th><th>Error</th><th>Resolved</th><th>Action</th>';
            html+='</tr></thead><tbody>';
            
            data.forEach(item=>{
                html+='<tr>';
                if(tab==='users') html+=`<td>${item.id}</td><td>${item.email}</td><td>${item.username}</td><td><span class="badge badge-${item.role}">${item.role}</span></td><td>${new Date(item.created_at).toLocaleDateString()}</td>`;
                else if(tab==='conversations') html+=`<td>${item.id}</td><td>${item.user_id}</td><td>${item.title||'-'}</td><td>${item.message_count}</td><td>${new Date(item.created_at).toLocaleDateString()}</td>`;
                else html+=`<td>${item.id}</td><td>${item.user_id}</td><td>${(item.original_prompt||'').substring(0,50)}...</td><td>${item.error_type||'-'}</td><td>${item.resolved?'✅':'❌'}</td><td><button class="btn-sm" onclick="deleteError(${item.id})">Delete</button></td>`;
                html+='</tr>';
            });
            html+='</tbody></table>';
            document.getElementById('tabContent').innerHTML=html;
        }

        async function deleteError(id){await fetch(`/admin/error/${id}`,{method:'DELETE',headers:{'Authorization':`Bearer ${token}`}});loadTab('errors',document.querySelector('.tab.active'));}
        function logout(){localStorage.clear();window.location.href='/';}
        
        loadTab('users',document.querySelector('.tab'));
    </script>
</body>
</html>
